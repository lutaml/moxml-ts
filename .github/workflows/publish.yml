name: publish

# npm trusted publishing (OIDC — no token). Requires the package to
# exist on npmjs with the trusted-publisher binding to this repo +
# workflow configured (npmjs.com package settings); the FIRST
# publish is manual (npm publish from a checkout) to establish it,
# after which this workflow publishes on every GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # fetch-wasm.sh (a build step AND npm test's pretest hook)
      # pulls the pinned bundles through gh api.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1 (the OIDC exchange);
      # node 22 bundles npm 10.x, which never sends the claim and the
      # registry answers an unauthenticated PUT with E404.
      - run: npm install -g npm@latest
      - run: npm install
      # The wasm vendor bundles are gitignored and fetched at the pin
      # releases - the build imports them, so they must exist first.
      - run: npm run fetch:wasm
      - run: npm run build
      - run: npm test
      # OIDC provenance: npm >= 11.5.1 attests through the id-token
      # permission — no _authToken in the environment.
      - run: npm publish
